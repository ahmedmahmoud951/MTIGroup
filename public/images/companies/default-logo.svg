<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="diamondCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="diamondBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(244,63,94,0.4)" />
      <stop offset="100%" stop-color="rgba(159,18,57,0.55)" />
    </linearGradient>
    <filter id="diamondGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Aura -->
  <circle cx="60" cy="60" r="46" fill="rgba(56,189,248,0.14)" filter="url(#diamondGlow)" />
  <circle cx="60" cy="60" r="48" stroke="url(#diamondCyan)" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Outer Interlocking Diamond Shield -->
  <polygon points="60,14 102,60 60,106 18,60" stroke="url(#diamondCyan)" stroke-width="2.8" fill="rgba(56,189,248,0.12)" filter="url(#diamondGlow)" />
  
  <!-- Inner Velvet Burgundy Core Diamond -->
  <polygon points="60,28 88,60 60,92 32,60" stroke="#fb7185" stroke-width="2" fill="url(#diamondBurgundy)" />

  <!-- Center Jewel Facets -->
  <polygon points="60,42 74,60 60,78 46,60" fill="url(#diamondCyan)" filter="url(#diamondGlow)" />
  <circle cx="60" cy="60" r="5" fill="#ffffff" />

  <!-- Corner Crest Nodes -->
  <circle cx="60" cy="14" r="3.5" fill="#ffffff" filter="url(#diamondGlow)" />
  <circle cx="102" cy="60" r="3.5" fill="#38bdf8" filter="url(#diamondGlow)" />
  <circle cx="60" cy="106" r="3.5" fill="#ffffff" filter="url(#diamondGlow)" />
  <circle cx="18" cy="60" r="3.5" fill="#38bdf8" filter="url(#diamondGlow)" />
</svg>
